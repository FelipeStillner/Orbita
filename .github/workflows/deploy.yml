name: Deploy

on:
  push:
    branches:
      - prod

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  build_backend:
    runs-on: ubuntu-latest
    needs: [build_frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact (for go:embed)
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build backend
        run: |
          set -euxo pipefail
          go build -o bin/orbita cmd/server/main.go

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-bin
          path: bin/orbita
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: [build_backend]

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-bin
          path: artifacts/bin

      - name: Create release directory on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            bash -lc '
              set -euxo pipefail
              release_dir="$HOME/Orbita/releases/$(date +%Y%m%d%H%M%S)"
              mkdir -p "$release_dir/bin"
              echo "$release_dir" > "$HOME/Orbita/.last_release_dir"
            '

      - name: Upload artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "artifacts/"
          target: "~/Orbita/releases/"
          strip_components: 1

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            bash -lc '
              set -euxo pipefail
              release_dir="$(cat "$HOME/Orbita/.last_release_dir")"

              cd "$HOME/Orbita"
              ln -sfn "$release_dir" current

              echo "Stopping old server..."
              sudo -n pkill orbita || true

              echo "Starting new server..."
              nohup "$HOME/Orbita/current/bin/orbita" > "$HOME/Orbita/orbita.log" 2>&1 &
            '
